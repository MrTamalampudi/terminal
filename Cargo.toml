[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.11.3"
plotters = "0.3"
# The backend bridging plotters to GTK's Cairo context
plotters-cairo = "0.3"
cairo-rs = "0.15"
gio = "0.22.6"
glib = "0.22.7"


tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.12"
bytes = "1.5"
http = "1.0"
url = "2.4"
reqwest = {version="0.13.4",features = ["blocking", "json"]}
byteorder = "1.5.0"
base64 = "0.22.1"

[build-dependencies]
prost-build = "0.12"
